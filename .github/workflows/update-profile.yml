name: Update Profile After Deploy

on:
  check_run:
    types: [completed]

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Print check run info
        env:
          APP_NAME: ${{ github.event.check_run.app.name }}
          APP_SLUG: ${{ github.event.check_run.app.slug }}
          CHECK_NAME: ${{ github.event.check_run.name }}
          STATUS: ${{ github.event.check_run.status }}
          CONCLUSION: ${{ github.event.check_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.check_run.check_suite.head_branch }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
          DETAILS_URL: ${{ github.event.check_run.details_url }}
        run: |
          echo "===== Check Run Info ====="
          echo "App name:     $APP_NAME"
          echo "App slug:     $APP_SLUG"
          echo "Check name:   $CHECK_NAME"
          echo "Status:       $STATUS"
          echo "Conclusion:   $CONCLUSION"
          echo "Head branch:  $HEAD_BRANCH"
          echo "Head SHA:     $HEAD_SHA"
          echo "Details URL:  $DETAILS_URL"
          echo "=========================="

      - name: Print full check_run payload
        env:
          CHECK_RUN_JSON: ${{ toJSON(github.event.check_run) }}
        run: |
          echo "$CHECK_RUN_JSON" | jq '.'

      - name: Trigger profile update
        if: >
          github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
          github.event.check_run.conclusion == 'success' &&
          github.event.check_run.check_suite.head_branch == 'main'
        env:
          GH_TOKEN: ${{ secrets.PROFILE_ACTION_TOKEN }}
        run: |
          echo "Cloudflare Pages deployment succeeded."
          echo "Triggering liuly0322/liuly0322 update.yml..."

          gh workflow run update.yml \
            --repo liuly0322/liuly0322 \
            --ref main

      - name: Explain why profile update was skipped
        if: >
          !(
            github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
            github.event.check_run.conclusion == 'success' &&
            github.event.check_run.check_suite.head_branch == 'main'
          )
        run: |
          echo "Profile update was NOT triggered."
          echo ""
          echo "Expected:"
          echo "  app.slug   = cloudflare-workers-and-pages"
          echo "  conclusion = success"
          echo "  branch     = main"
          echo ""
          echo "Actual:"
          echo "  app.slug   = ${{ github.event.check_run.app.slug }}"
          echo "  conclusion = ${{ github.event.check_run.conclusion }}"
          echo "  branch     = ${{ github.event.check_run.check_suite.head_branch }}"
